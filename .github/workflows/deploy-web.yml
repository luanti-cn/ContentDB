name: deploy-web

# 前端(frontend/)变更推送到 main → 自动部署 luanti.cn
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /opt/luanticn/contentdb/frontend
            git pull --ff-only
            pnpm install --frozen-lockfile
            pnpm build
            sudo systemctl restart luanticn-web
            sleep 3
            systemctl is-active --quiet luanticn-web && echo "luanticn-web is up"
            curl -sf http://127.0.0.1:3000 > /dev/null && echo "web healthcheck ok"
